name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install huggingface_hub

      - name: Locate dataset file
        run: |
          CSV_PATH=$(find . -type f -name "tourism.csv" -not -path "./.git/*" | head -n 1)
          if [ -z "$CSV_PATH" ]; then
            echo "tourism.csv not found in the repository. Files present:"
            find . -type f -not -path "./.git/*" | head -50
            exit 1
          fi
          echo "Using dataset at: $CSV_PATH"
          echo "CSV_PATH=$CSV_PATH" >> "$GITHUB_ENV"

      - name: Upload Dataset to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          print("Authenticated as:", api.whoami()["name"])
          api.create_repo(
              repo_id="DrGee/tourism-package-prediction",
              repo_type="dataset",
              private=False,
              exist_ok=True,
          )
          api.upload_file(
              path_or_fileobj=os.environ["CSV_PATH"],
              path_in_repo="tourism.csv",
              repo_id="DrGee/tourism-package-prediction",
              repo_type="dataset",
          )
          print("Uploaded", os.environ["CSV_PATH"])
          EOF

  data-prep: 
  runs-on: ubuntu-latest needs: 
  needs: register-dataset  
  steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upload prepared files
        uses: actions/upload-artifact@v4
        with:
          name: prepared-model-files
          path: |
            tourism_project/deployment/encoder.joblib
            tourism_project/data/tourism.csv
 
      - name: Check required files
        run: |
          for f in requirements.txt tourism_project/model_building/prep.py; do
            if [ ! -f "$f" ]; then
              echo "Missing: $f"
              echo "Files in the repo:"
              find . -maxdepth 3 -type f -not -path "./.git/*" | sort
              exit 1
            fi
          done
 
      - name: Install Dependencies
        run: pip install -r requirements.txt
 
      - name: Run Data Preparation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tourism_project/model_building/prep.py

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements_workflow.txt
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &
          sleep 10
      - name: Model Building
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tourism_project/model_building/model_training.py

  deploy-hosting:
    needs: model-training
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: pip install -r tourism_project/deployment/requirements.txt
      - name: Download Model and Encoder from Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "from huggingface_hub import hf_hub_download; hf_hub_download(repo_id='DrGee/tourism-package-model', filename='rf_model.joblib', local_dir='tourism_project/deployment/')"
          python -c "from huggingface_hub import hf_hub_download; hf_hub_download(repo_id='DrGee/tourism-package-prediction', filename='encoder.joblib', repo_type='dataset', local_dir='tourism_project/deployment/')"
      - name: Push files to Frontend Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git clone https://DrGee:${HF_TOKEN}@huggingface.co/spaces/DrGee/tourism-package-space frontend_space
          cp tourism_project/deployment/app.py frontend_space/
          cp tourism_project/deployment/rf_model.joblib frontend_space/
          cp tourism_project/deployment/encoder.joblib frontend_space/
          cp tourism_project/deployment/requirements.txt frontend_space/
          cp tourism_project/data/tourism.csv frontend_space/
          cp tourism_project/deployment/Dockerfile frontend_space/ 2>/dev/null || true
          cd frontend_space
          git add .
          git commit -m "Update Streamlit app and model" || echo "Nothing to commit"
          git push
